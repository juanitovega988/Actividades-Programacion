<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica de Event Listeners</title>
    <!-- Vinculación del script con el atributo defer -->
    <script src="script.js" defer></script>
</head>
<body>

    <h1>Práctica Guiada: Event Listeners</h1>

    <!-- Bloque 1: Botón interactivo -->
    <section>
        <h3>1. Evento 'click'</h3>
        <button id="myButton">Haz clic aquí</button>
    </section>

    <!-- Bloque 2: Caja para movimiento de ratón -->
    <section>
        <h3>2. Eventos 'mouseover' y 'mouseout'</h3>
        <div id="boxElement" style="width: 250px; height: 120px; background-color: #3498db; color: white; display: flex; align-items: center; justify-content: center; border-radius: 8px;">
            Pasa el cursor por aquí
        </div>
    </section>

    <!-- Bloque 4: Input de texto en tiempo real -->
    <section>
        <h3>4. Evento 'input' en tiempo real</h3>
        <input type="text" id="usernameInput" placeholder="Escribe algo aquí...">
        <h2 id="greetingHeading"></h2>
    </section>

 <!-- Bloque 5: Botón de ejecución única -->
    <section>
        <h3>5. Opción { once: true }</h3>
        <button id="singleButton">Haz clic una sola vez</button>
    </section>

</body>
</html>
